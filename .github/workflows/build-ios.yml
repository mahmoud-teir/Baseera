name: Build iOS IPA (Sideloadly & AltStore)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release asset?'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APP_VARIANT: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://yxqdquynlgfbxyultsux.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_GRjzLk5J0N15SBcUhr2zMQ_1SJ9JEqe' }}
      EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL || 'https://baseera.app' }}

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: 🍎 Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: ⚙️ Generate iOS Native Project (Expo Prebuild)
        run: |
          npx expo prebuild --platform ios --clean --no-install

      - name: ☕ Install CocoaPods Dependencies
        working-directory: ios
        run: |
          pod install --repo-update

      - name: 🔨 Compile iOS Archive (No Code Signing Required)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          echo "Using workspace: $WORKSPACE"
          
          # Detect available scheme
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1; next} flag && /^[[:space:]]+[a-zA-Z0-9_]+/{print $1; exit}')
          if [ -z "$SCHEME" ]; then
            SCHEME="baseerah"
          fi
          echo "Using scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/baseerah.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS=""

      - name: 📦 Package .app into .ipa for Sideloadly / AltStore
        run: |
          APP_PATH=$(find build/baseerah.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in archive"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y "baseerah-ios.ipa" Payload
          
          ls -lh baseerah-ios.ipa

      - name: 📤 Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseerah-ios-ipa
          path: baseerah-ios.ipa
          retention-days: 14

      - name: 🚀 Publish to GitHub Releases (if requested)
        if: ${{ github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: baseerah-ios.ipa
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name || 'v1.1.0-ios' }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
