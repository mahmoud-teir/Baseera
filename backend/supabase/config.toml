# Supabase CLI config — run commands with `--workdir backend` from the repo root.
project_id = "baseerah"

[api]
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["baseerah://auth/sign-in", "http://localhost:8081/auth/sign-in", "http://127.0.0.1:4173/auth/sign-in"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.verify-certificate]
verify_jwt = false

[functions.submit-report]
verify_jwt = false

[functions.submit-feedback]
verify_jwt = false
